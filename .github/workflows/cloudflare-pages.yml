# Publica el repo en Cloudflare Pages en cada cambio a main.
# Necesita el secreto CLOUDFLARE_API_TOKEN en el repo (Settings > Secrets and variables > Actions);
# mientras no exista, el paso de publicar se salta.
name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c455a0809b784a5318aed717a2e133b9
      PROYECTO: grupo-rc-sitio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p "$RUNNER_TEMP/salida"
          rsync -a --exclude .git --exclude .github --exclude .claude --exclude supabase \
            --exclude functions --exclude node_modules --exclude AGENTS.md ./ "$RUNNER_TEMP/salida/"
          npx --yes wrangler@4 pages project create "$PROYECTO" --production-branch=main || true
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/salida" --project-name="$PROYECTO" --branch=main --commit-dirty=true
