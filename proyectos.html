<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icono-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Proyectos de redes perimetrales y deportivas | Redes Deportivas RC</title>
<meta name="description" content="Portafolio de proyectos de Grupo RC: instalaciones de redes perimetrales, deportivas y porterías en escuelas, hoteles y complejos deportivos.">
<link rel="canonical" href="https://www.redesdeportivasrc.com/proyectos.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/medicion.js"></script>
</head>
<body data-nivel="raiz">
<div id="site-header"></div>

<section class="hero-interior">
  <div class="envolvente">
    <div class="migas" style="color:#9fc3d1;"><a href="index.html" style="color:#9fc3d1;">Inicio</a> / Proyectos</div>
    <h1>Proyectos entregados.</h1>
    <p>Instalaciones reales en canchas, escuelas, hoteles y complejos deportivos.</p>
  </div>
</section>

<section class="franja">
  <div class="envolvente">
    <div class="grid-cards g3" id="cont-proyectos"></div>
  </div>
</section>

<section class="franja-chica" style="background:var(--hueso);">
  <div class="envolvente centrado" style="max-width:600px;">
    <h2>¿Tu proyecto sigue?</h2>
    <p class="kicker centrado">Cuéntanos qué necesitas resolver, no hace falta que sepas el producto exacto.</p>
    <a href="contacto.html" class="btn btn-negro" style="margin-top:14px;">Contarles mi proyecto</a>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async ()=>{
  renderHeader('proyectos');
  renderFooter();
  document.getElementById('cont-proyectos').innerHTML = (await obtenerProyectos()).map(pr => `
    <div class="tarjeta-proyecto" id="${pr.slug}">
      ${fotoOMarcador(pr.fotos[0], pr.nombre, 'oscuro')}
      <div class="tarjeta-proyecto-body">
        <span>${pr.tipo}</span>
        <h3>${pr.nombre}</h3>
      </div>
    </div>
  `).join('');
})();
</script>
</body>
</html>
