<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos de instalación de redes deportivas | Redes Deportivas RC</title>
<meta name="description" content="Videos de instalaciones, fabricación y proyectos de Grupo RC.">
<link rel="canonical" href="https://www.redesdeportivasrc.com/videos.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/medicion.js"></script>
</head>
<body data-nivel="raiz">
<div id="site-header"></div>

<section class="hero-interior">
  <div class="envolvente">
    <div class="migas" style="color:#9fc3d1;"><a href="index.html" style="color:#9fc3d1;">Inicio</a> / Videos</div>
    <h1>Videos destacados.</h1>
    <p>Instalaciones, fabricación y proyectos reales, en video.</p>
  </div>
</section>

<section class="franja">
  <div class="envolvente">
    <div class="grid-cards g3" id="cont-videos"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
  renderHeader('videos');
  renderFooter();
  // Mientras no haya videos con liga real, se manda a los canales donde ya están publicados.
  const videosReales = VIDEOS.filter(v=>v.url);
  if(!videosReales.length){
    document.getElementById('cont-videos').outerHTML = `
      <div class="banner-ancho">
        <div><h2>Mira nuestros videos</h2><p>Instalaciones, fabricación y proyectos reales. Publicamos en YouTube y en Facebook.</p></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <a href="${EMPRESA.redes.youtube}" target="_blank" rel="noopener" class="btn btn-azul">Ver en YouTube</a>
          <a href="${EMPRESA.redes.facebook}" target="_blank" rel="noopener" class="btn btn-blanco">Ver en Facebook</a>
        </div>
      </div>`;
  }else document.getElementById('cont-videos').innerHTML = videosReales.map(v=>`
    <div>
      <div style="position:relative;border-radius:14px;overflow:hidden;">
        <div class="foto-ph oscuro" style="min-height:200px;"><span>${v.titulo}</span></div>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;">▶</div>
      </div>
      <p style="margin-top:10px;font-size:.82rem;color:var(--gris);">${v.categoria}</p>
    </div>`).join('');
</script>
</body>
</html>
