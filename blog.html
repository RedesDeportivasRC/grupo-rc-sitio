<section class="hero-interior">

<script src="assets/js/common.js"></script>
<script>
  renderHeader('blog');
  renderFooter();
  // Mientras los artículos no tengan texto real, se muestran como "Próximamente" y no llevan a ninguna parte.
  document.getElementById('cont-blog').innerHTML = BLOG_POSTS.map(b=>esMarcador(b.contenido) ? `
    <div class="tarjeta-blog">${fotoOMarcador(null, b.titulo)}<div class="tarjeta-blog-body"><span>${b.categoria} · Próximamente</span><h3>${b.titulo}</h3></div></div>` : renderBlogCard(b)).join('');
</script>
