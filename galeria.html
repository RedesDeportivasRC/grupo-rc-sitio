<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de redes perimetrales y deportivas instaladas | Redes Deportivas RC</title>
<meta name="description" content="Galería de fotografías de Grupo RC: productos, proyectos y aplicaciones de nuestras redes.">
<link rel="canonical" href="https://www.redesdeportivasrc.com/galeria.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/medicion.js"></script>
</head>
<body data-nivel="raiz">
<div id="site-header"></div>

<section class="hero-interior">
  <div class="envolvente">
    <div class="migas" style="color:#9fc3d1;"><a href="index.html" style="color:#9fc3d1;">Inicio</a> / Galería</div>
    <h1>Galería de redes deportivas.</h1>
    <p>Redes que ya están trabajando: canchas, escuelas, obras y más.</p>
  </div>
</section>

<section class="franja-chica">
  <div class="envolvente" style="display:flex;gap:10px;flex-wrap:wrap;">
    <button class="btn btn-negro btn-chico" data-filtro="todos">Todo</button>
    <button class="btn btn-linea btn-chico" data-filtro="perimetral">Redes perimetrales</button>
    <button class="btn btn-linea btn-chico" data-filtro="porterias">Porterías</button>
    <button class="btn btn-linea btn-chico" data-filtro="voleibol">Voleibol</button>
    <button class="btn btn-linea btn-chico" data-filtro="basquetbol">Básquetbol y baloneras</button>
    <button class="btn btn-linea btn-chico" data-filtro="instalacion">Instalación</button>
    <button class="btn btn-linea btn-chico" data-filtro="taller">Taller</button>
  </div>
</section>

<section class="franja">
  <div class="envolvente">
    <div class="grid-cards g3" id="cont-galeria" style="grid-auto-rows:220px;"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
  renderHeader('galeria');
  renderFooter();
  // Fotos reales: las de assets/img/trabajos (FOTOS_TRABAJOS) + las del banner que se suben en AndyControl.
  let FOTOS_GALERIA = FOTOS_TRABAJOS.map(f=>({ categoria:f.categoria, src:'assets/img/trabajos/'+f.archivo, alt:f.alt }));
  function pintarGaleria(filtro){
    const lista = filtro==='todos' ? FOTOS_GALERIA : FOTOS_GALERIA.filter(f=>f.categoria===filtro);
    document.getElementById('cont-galeria').innerHTML = lista.map(f=>`<img src="${f.src}" alt="${f.alt}" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`).join('') || '<p style="color:var(--gris);">Pronto subiremos fotos de esta categoría.</p>';
    revelar('cont-galeria', true);
  }
  pintarGaleria('todos');
  obtenerFotosBanner().then(fotos=>{ FOTOS_GALERIA = FOTOS_GALERIA.concat(fotos.map(u=>({ categoria:'proyecto', src:u, alt:'Trabajo de redes deportivas realizado por Redes Deportivas RC' }))); pintarGaleria('todos'); });
  document.querySelectorAll('[data-filtro]').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('[data-filtro]').forEach(b=>b.className='btn btn-linea btn-chico');
      btn.className = 'btn btn-negro btn-chico';
      pintarGaleria(btn.dataset.filtro);
    };
  });
</script>
</body>
</html>
