<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icono-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Clientes y proyectos de redes deportivas en Yucatán | Redes Deportivas RC</title>
<meta name="description" content="Universidad Modelo, Hotel Chablé, Domo Morelos, escuelas y colegios de Yucatán que confían en Redes Deportivas RC: redes perimetrales, porterías, redes antipalomas y opiniones de clientes.">
<link rel="canonical" href="https://www.redesdeportivasrc.com/clientes.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/medicion.js"></script>
</head>
<body data-nivel="raiz">
<div id="site-header"></div>

<section class="hero-interior">
  <div class="envolvente">
    <div class="migas" style="color:#9fc3d1;"><a href="index.html" style="color:#9fc3d1;">Inicio</a> / Clientes</div>
    <h1>Clientes y proyectos.</h1>
    <p>Escuelas, universidades, hoteles y gobiernos municipales que confiaron en nosotros para sus redes, porterías y canchas.</p>
    <a href="#opiniones" class="testimonios-resumen" id="cont-testimonios-resumen" style="margin-top:18px;"></a>
  </div>
</section>

<section class="franja">
  <div class="envolvente">
    <div class="clientes-lista" id="cont-clientes-rc"></div>
  </div>
</section>

<section class="franja" style="background:var(--azul-osc);" id="opiniones">
  <div class="envolvente">
    <span class="ojo">Lo que dicen nuestros clientes</span>
    <h2 style="color:#fff;">Opiniones</h2>
    <p style="color:#9fc3d1;margin-top:10px;max-width:60ch;">Comentarios reales de clientes en Facebook y Google.</p>
    <div class="testimonios testimonios-rejilla" id="cont-testimonios" style="margin-top:26px;"></div>
    <div style="margin-top:28px;"><a href="resena.html" class="btn btn-azul">⭐ ¿Ya eres cliente? Déjanos tu opinión</a></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
renderHeader('clientes');
renderFooter();
document.getElementById('cont-clientes-rc').innerHTML = CLIENTES_RC.map((c,i)=>`
  <article class="cliente-rc" id="${c.slug}">
    <div class="cliente-rc-fotos">
      <img src="assets/img/trabajos/${c.fotos[0][0]}" alt="${c.fotos[0][1]}" loading="${i<1?'eager':'lazy'}">
      ${c.fotos.length>1 ? `<div class="cliente-rc-mini">${c.fotos.slice(1).map(f=>`<img src="assets/img/trabajos/${f[0]}" alt="${f[1]}" loading="lazy">`).join('')}</div>` : ''}
    </div>
    <div class="cliente-rc-texto">
      <span class="cliente-rc-tipo">${c.tipo}</span>
      <h2>${c.nombre}</h2>
      <div class="cliente-rc-lugar">📍 ${c.lugar}</div>
      <p>${c.texto}</p>
      <div class="cliente-rc-prod">${c.productos.map(pr=>`<a href="productos/${pr[1]}.html">${pr[0]} →</a>`).join('')}</div>
    </div>
  </article>`).join('');
// Tocar una miniatura la pone como foto principal
document.querySelectorAll('.cliente-rc').forEach(a=>{
  const grande = a.querySelector('.cliente-rc-fotos > img');
  a.querySelectorAll('.cliente-rc-mini img').forEach(m=>m.addEventListener('click',()=>{
    const s=grande.src, al=grande.alt; grande.src=m.src; grande.alt=m.alt; m.src=s; m.alt=al;
  }));
});
renderTestimonios('cont-testimonios', 'opiniones');
revelar('cont-testimonios');
</script>
</body>
</html>
